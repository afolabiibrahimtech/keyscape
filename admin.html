<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin | Keyscape Homes</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root { --primary: #0f4c3a; --accent: #1a8c6b; --light: #f8fafc; --dark: #111827; }
    body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--light); color: var(--dark); }

    .login-screen { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: var(--primary); }
    .login-card { background: white; border-radius: 20px; padding: 3rem 2.5rem; width: 90%; max-width: 400px; text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
    .login-card h1 { color: var(--primary); margin-bottom: 0.5rem; font-size: 1.8rem; display:flex; align-items:center; justify-content:center; gap:10px; }
    .login-card p { color: #666; margin-bottom: 2rem; }
    .login-card input { width: 100%; padding: 14px 16px; border: 2px solid #e2e8f0; border-radius: 10px; font-size: 1rem; outline: none; margin-bottom: 1rem; text-align: center; letter-spacing: 4px; }
    .login-card input:focus { border-color: var(--primary); }
    .login-btn { width: 100%; padding: 14px; background: var(--primary); color: white; border: none; border-radius: 10px; font-size: 1rem; font-weight: 600; cursor: pointer; }
    .login-btn:hover { background: var(--accent); }
    .login-error { color: #ef4444; font-size: 0.9rem; margin-top: 10px; display: none; }

    .admin-page { display: none; }
    .admin-nav { background: var(--primary); color: white; padding: 1rem 5%; display: flex; justify-content: space-between; align-items: center; }
    .admin-nav h1 { font-size: 1.4rem; display:flex; align-items:center; gap:10px; }
    .logout-btn { background: rgba(255,255,255,0.15); color: white; border: none; padding: 8px 16px; border-radius: 8px; cursor: pointer; font-weight: 600; }
    .admin-body { max-width: 1100px; margin: 0 auto; padding: 2rem 5%; }

    .stats-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 1rem; margin-bottom: 2rem; }
    .stat-card { background: white; border-radius: 12px; padding: 1.2rem; text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.06); }
    .stat-card .num { font-size: 2rem; font-weight: 700; color: var(--primary); }
    .stat-card .label { color: #666; font-size: 0.9rem; margin-top: 4px; }

    .tab-btns { display: flex; gap: 8px; margin-bottom: 1.5rem; }
    .tab-btn { padding: 8px 20px; border-radius: 8px; border: 2px solid #e2e8f0; background: white; cursor: pointer; font-weight: 600; font-size: 0.9rem; transition: all 0.2s; }
    .tab-btn.active { background: var(--primary); color: white; border-color: var(--primary); }

    .listing-card { background: white; border-radius: 16px; padding: 1.5rem; margin-bottom: 1rem; box-shadow: 0 4px 20px rgba(0,0,0,0.06); display: grid; grid-template-columns: 120px 1fr auto; gap: 1.2rem; align-items: start; }
    .listing-card img { width: 120px; height: 90px; object-fit: cover; border-radius: 10px; background: #e2e8f0; }
    .listing-info h3 { font-size: 1.1rem; color: var(--primary); margin-bottom: 4px; }
    .listing-info p { color: #666; font-size: 0.9rem; margin-bottom: 3px; display: flex; align-items: center; gap: 6px; }
    .listing-info .price { color: var(--primary); font-weight: 700; font-size: 1rem; }
    .listing-info svg { flex-shrink: 0; color: #94a3b8; }
    .host-chip { display: inline-flex; align-items: center; gap: 8px; background: #f0fdf4; border-radius: 20px; padding: 4px 12px; margin: 6px 0; }
    .host-chip img { width: 28px; height: 28px; border-radius: 50%; object-fit: cover; }
    .host-chip span { font-size: 0.85rem; font-weight: 600; color: var(--primary); }

    .badge { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 20px; font-size: 0.78rem; font-weight: 600; margin-bottom: 8px; }
    .badge.pending { background: #fef3c7; color: #92400e; }
    .badge.approved { background: #d1fae5; color: #065f46; }
    .badge.rejected { background: #fee2e2; color: #991b1b; }

    .action-btns { display: flex; flex-direction: column; gap: 8px; min-width: 110px; }
    .approve-btn, .reject-btn, .delete-btn, .pending-btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      padding: 8px 14px; border-radius: 8px; border: none; font-weight: 600;
      cursor: pointer; font-size: 0.85rem; transition: all 0.2s;
    }
    .approve-btn { background: #d1fae5; color: #065f46; }
    .approve-btn:hover { background: #6ee7b7; }
    .reject-btn { background: #fee2e2; color: #991b1b; }
    .reject-btn:hover { background: #fca5a5; }
    .pending-btn { background: #fef3c7; color: #92400e; }
    .pending-btn:hover { background: #fde68a; }
    .delete-btn { background: #f1f5f9; color: #64748b; }
    .delete-btn:hover { background: #e2e8f0; }

    .empty-state { text-align: center; padding: 3rem; color: #94a3b8; }
    .empty-state svg { margin-bottom: 1rem; color: #cbd5e1; }

    .spin { animation: spin 1s linear infinite; }
    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

    @media (max-width: 600px) {
      .listing-card { grid-template-columns: 1fr; }
      .listing-card img { width: 100%; height: 160px; }
      .action-btns { flex-direction: row; }
    }
  </style>
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
</head>
<body>
  <div class="login-screen" id="loginScreen">
    <div class="login-card">
      <h1>
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
        Admin
      </h1>
      <p>Keyscape Homes Dashboard</p>
      <input type="email" id="emailInput" placeholder="Admin email" autocomplete="username" style="letter-spacing:normal; text-align:left;">
      <input type="password" id="passwordInput" placeholder="Password" autocomplete="current-password" onkeyup="if(event.key==='Enter') login()" style="letter-spacing:normal; text-align:left;">
      <button class="login-btn" id="loginBtn" onclick="login()">Login</button>
      <p class="login-error" id="loginError">Incorrect email or password, or this account does not have admin access.</p>
    </div>
  </div>

  <div class="admin-page" id="adminPage">
    <div class="admin-nav">
      <h1>
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        Keyscape Admin
      </h1>
      <button class="logout-btn" onclick="logout()">Logout</button>
    </div>
    <div class="admin-body">
      <div class="stats-row">
        <div class="stat-card"><div class="num" id="statPending">0</div><div class="label">Pending Review</div></div>
        <div class="stat-card"><div class="num" id="statApproved">0</div><div class="label">Approved</div></div>
        <div class="stat-card"><div class="num" id="statRejected">0</div><div class="label">Rejected</div></div>
      </div>
      <div class="tab-btns">
        <button class="tab-btn active" onclick="switchTab('pending', this)">Pending</button>
        <button class="tab-btn" onclick="switchTab('approved', this)">Approved</button>
        <button class="tab-btn" onclick="switchTab('rejected', this)">Rejected</button>
      </div>
      <div id="listingsContainer"></div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-auth.js";
    import { getFirestore, collection, getDocs, doc, getDoc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyD34KXZcVyxnqN_wuP5GShI8uNbe6osXVQ",
      authDomain: "keyscape-homes.firebaseapp.com",
      databaseURL: "https://keyscape-homes-default-rtdb.firebaseio.com",
      projectId: "keyscape-homes",
      storageBucket: "keyscape-homes.firebasestorage.app",
      messagingSenderId: "8066332433",
      appId: "1:8066332433:web:571a5335e2796d3845feb0",
      measurementId: "G-F9CP7R9BH5"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let currentTab = 'pending';
    let allListings = [];

    // ===== EmailJS =====
    const EMAILJS_SERVICE_ID = 'service_42jjrjs';
    const EMAILJS_TEMPLATE_ID = 'template_vzltrp8';
    const EMAILJS_PUBLIC_KEY = 'K5Z74G1ipcpe1WhHL';
    emailjs.init({ publicKey: EMAILJS_PUBLIC_KEY });

    async function sendStatusEmail(listing, status) {
      // Only email host for approved/rejected — not for "pending" (no host-facing message)
      if (status !== 'approved' && status !== 'rejected') return;
      if (!listing.hostEmail) return; // no email on file, skip silently

      const messages = {
        approved: "Congratulations! Your listing is now live on Keyscape Homes and visible to guests.",
        rejected: "Unfortunately, your listing did not meet our requirements at this time. Please review your listing details and resubmit, or contact us for more information."
      };

      try {
        await emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, {
          to_email: listing.hostEmail,
          to_name: listing.hostName || 'Host',
          property_name: listing.name,
          status: status,
          message: messages[status]
        });
      } catch (e) {
        console.error('Failed to send status email:', e);
      }
    }

    // ===== Icons =====
    const iconLocation = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13S3 17 3 10a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/></svg>`;
    const iconHome = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>`;
    const iconStar = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>`;
    const iconCheck = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 11-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>`;
    const iconX = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>`;
    const iconClock = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>`;
    const iconUndo = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 102.13-9.36L1 10"/></svg>`;
    const iconTrash = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/><path d="M10 11v6M14 11v6"/></svg>`;
    const iconInbox = `<svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.45 5.11L2 12v6a2 2 0 002 2h16a2 2 0 002-2v-6l-3.45-6.89A2 2 0 0016.76 4H7.24a2 2 0 00-1.79 1.11z"/></svg>`;

    function avatarPlaceholder(name, size) {
      const initial = (name || '?').charAt(0).toUpperCase();
      const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
        <rect width="100%" height="100%" rx="${size}" fill="#0f4c3a"/>
        <text x="50%" y="50%" dy=".35em" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="${size/2}" font-weight="600">${initial}</text>
      </svg>`;
      return `data:image/svg+xml;base64,${btoa(svg)}`;
    }

    window.login = async function() {
      const email = document.getElementById('emailInput').value.trim();
      const password = document.getElementById('passwordInput').value;
      const btn = document.getElementById('loginBtn');
      const errorEl = document.getElementById('loginError');
      errorEl.style.display = 'none';

      if (!email || !password) {
        errorEl.textContent = 'Please enter your email and password.';
        errorEl.style.display = 'block';
        return;
      }

      btn.textContent = 'Logging in...';
      btn.disabled = true;

      try {
        const result = await signInWithEmailAndPassword(auth, email, password);
        const snap = await getDoc(doc(db, 'hosts', result.user.uid));

        if (!snap.exists() || snap.data().role !== 'admin') {
          await signOut(auth);
          errorEl.textContent = 'This account does not have admin access.';
          errorEl.style.display = 'block';
          btn.textContent = 'Login';
          btn.disabled = false;
          return;
        }

        // Role confirmed — show dashboard
        document.getElementById('loginScreen').style.display = 'none';
        document.getElementById('adminPage').style.display = 'block';
        loadListings();
      } catch (e) {
        errorEl.textContent = 'Incorrect email or password.';
        errorEl.style.display = 'block';
        btn.textContent = 'Login';
        btn.disabled = false;
      }
    };

    window.logout = async function() {
      await signOut(auth);
      document.getElementById('loginScreen').style.display = 'flex';
      document.getElementById('adminPage').style.display = 'none';
      document.getElementById('emailInput').value = '';
      document.getElementById('passwordInput').value = '';
    };

    // If already signed in (page refresh) and has admin role, skip straight to dashboard
    onAuthStateChanged(auth, async (user) => {
      if (!user) return;
      const snap = await getDoc(doc(db, 'hosts', user.uid));
      if (snap.exists() && snap.data().role === 'admin') {
        document.getElementById('loginScreen').style.display = 'none';
        document.getElementById('adminPage').style.display = 'block';
        loadListings();
      }
    });

    async function loadListings() {
      const snap = await getDocs(collection(db, 'listings'));
      allListings = snap.docs.map(d => ({ firestoreId: d.id, ...d.data() }));
      renderDashboard();
    }

    function renderDashboard() {
      const pending = allListings.filter(l => l.status === 'pending');
      const approved = allListings.filter(l => l.status === 'approved');
      const rejected = allListings.filter(l => l.status === 'rejected');
      document.getElementById('statPending').textContent = pending.length;
      document.getElementById('statApproved').textContent = approved.length;
      document.getElementById('statRejected').textContent = rejected.length;
      renderTab(currentTab);
    }

    window.switchTab = function(tab, btn) {
      currentTab = tab;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderTab(tab);
    };

    function renderTab(tab) {
      const container = document.getElementById('listingsContainer');
      const data = allListings.filter(l => l.status === tab);

      if (data.length === 0) {
        container.innerHTML = `<div class="empty-state">${iconInbox}<p>No ${tab} listings.</p></div>`;
        return;
      }

      const badgeIcon = { pending: iconClock, approved: iconCheck, rejected: iconX };

      container.innerHTML = data.map(p => `
        <div class="listing-card">
          <img src="${p.image}" alt="${p.name}" onerror="this.style.background='#e2e8f0'">
          <div class="listing-info">
            <span class="badge ${tab}">${badgeIcon[tab]} ${tab.charAt(0).toUpperCase()+tab.slice(1)}</span>
            <h3>${p.name}</h3>
            <p>${iconLocation} ${p.location}</p>
            <p>${iconHome} ${p.address}</p>
            <p class="price">${p.price} / night · Max ${p.maxGuests} guests</p>
            <div class="host-chip">
              <img src="${p.hostPhoto || avatarPlaceholder(p.hostName, 28)}" alt="${p.hostName}">
              <span>${p.hostName} · ${p.hostPhone}</span>
            </div>
            ${p.amenities?.length ? `<p>${iconStar} ${p.amenities.join(', ')}</p>` : ''}
            ${p.description ? `<p style="margin-top:6px;color:#444;">${p.description}</p>` : ''}
            <p style="color:#94a3b8;font-size:0.8rem;margin-top:6px;">Submitted: ${new Date(p.submittedAt).toLocaleString('en-GB')}</p>
          </div>
          <div class="action-btns">
            ${tab === 'pending' ? `
              <button class="approve-btn" onclick="updateStatus('${p.firestoreId}', 'approved')">${iconCheck} Approve</button>
              <button class="reject-btn" onclick="updateStatus('${p.firestoreId}', 'rejected')">${iconX} Reject</button>
            ` : ''}
            ${tab === 'approved' ? `
              <button class="pending-btn" onclick="updateStatus('${p.firestoreId}', 'pending')">${iconUndo} Move to Pending</button>
              <button class="reject-btn" onclick="updateStatus('${p.firestoreId}', 'rejected')">${iconX} Remove</button>
            ` : ''}
            ${tab === 'rejected' ? `<button class="approve-btn" onclick="updateStatus('${p.firestoreId}', 'approved')">${iconCheck} Re-approve</button>` : ''}
            <button class="delete-btn" onclick="deleteListing('${p.firestoreId}')">${iconTrash} Delete</button>
          </div>
        </div>
      `).join('');
    }

    window.updateStatus = async function(firestoreId, status) {
      await updateDoc(doc(db, 'listings', firestoreId), { status });
      const item = allListings.find(l => l.firestoreId === firestoreId);
      if (item) {
        item.status = status;
        sendStatusEmail(item, status);
      }
      renderDashboard();
    };

    window.deleteListing = async function(firestoreId) {
      if (!confirm('Permanently delete this listing?')) return;
      await deleteDoc(doc(db, 'listings', firestoreId));
      allListings = allListings.filter(l => l.firestoreId !== firestoreId);
      renderDashboard();
    };
  </script>
</body>
</html>
