<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/jpeg" href="logo/favicon.jpg">
  <title>Log In | Keyscape Homes</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .auth-page { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #0f4c3a 0%, #1a8c6b 100%); padding: 2rem; }
    .auth-card { background: white; border-radius: 20px; padding: 2.5rem; width: 100%; max-width: 440px; box-shadow: 0 25px 60px rgba(0,0,0,0.25); }
    .auth-logo { text-align: center; margin-bottom: 1.5rem; }
    .auth-logo h1 { color: var(--primary); font-size: 1.8rem; transition: opacity 0.2s; }
    .auth-logo a:hover h1 { opacity: 0.75; }
    .guest-notice {
      display: flex; gap: 10px; align-items: flex-start;
      background: #f0fdf4; border: 1px solid #bbf7d0; border-radius: 10px;
      padding: 12px 14px; margin-bottom: 1.2rem; font-size: 0.85rem;
      color: var(--primary); line-height: 1.5;
    }
    .guest-notice svg { flex-shrink: 0; margin-top: 2px; }
    .guest-notice a { color: var(--primary); font-weight: 600; text-decoration: underline; }
    .auth-logo p { color: #666; font-size: 0.95rem; margin-top: 4px; }
    .form-group { margin-bottom: 1.1rem; }
    .form-group label { display: block; font-weight: 600; margin-bottom: 6px; font-size: 0.9rem; color: var(--dark); }
    .form-group input { width: 100%; padding: 12px 16px; border: 2px solid #e2e8f0; border-radius: 10px; font-size: 1rem; outline: none; transition: border-color 0.2s; }
    .form-group input:focus { border-color: var(--primary); }
    .auth-btn { width: 100%; padding: 14px; background: var(--primary); color: white; border: none; border-radius: 10px; font-size: 1rem; font-weight: 600; cursor: pointer; transition: all 0.2s; margin-top: 0.5rem; }
    .auth-btn:hover { background: var(--accent); transform: translateY(-2px); }
    .auth-btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .divider { display: flex; align-items: center; gap: 12px; margin: 1.2rem 0; color: #94a3b8; font-size: 0.9rem; }
    .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: #e2e8f0; }
    .google-btn { width: 100%; padding: 12px; background: white; color: #333; border: 2px solid #e2e8f0; border-radius: 10px; font-size: 1rem; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; transition: all 0.2s; }
    .google-btn:hover { border-color: #4285f4; background: #f8faff; }
    .google-btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .auth-footer { text-align: center; margin-top: 1.5rem; color: #666; font-size: 0.9rem; }
    .auth-footer a { color: var(--primary); font-weight: 600; text-decoration: none; }
    .forgot-link { text-align: right; margin-top: -6px; margin-bottom: 8px; }
    .forgot-link a { color: var(--primary); font-size: 0.85rem; text-decoration: none; }
    .error-msg { background: #fee2e2; color: #991b1b; padding: 10px 14px; border-radius: 8px; font-size: 0.9rem; margin-bottom: 1rem; display: none; }
    .spin { animation: spin 1s linear infinite; }
    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    .redirect-loading {
      display: none; flex-direction: column; align-items: center; gap: 1rem;
      padding: 2rem; text-align: center; color: #666;
    }
  </style>
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <div id="formView">
        <div class="auth-logo">
          <a href="index.html" style="display:inline-flex; align-items:center; gap:8px; text-decoration:none; color:var(--primary);">
            <h1 style="margin:0;">Keyscape Homes</h1>
          </a>
          <p>Welcome back</p>
        </div>

        <div class="guest-notice">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
          <span>Just looking for a place to stay? No account needed — <a href="index.html#listings">browse homes</a> to find and book your stay. This login is for property hosts.</span>
        </div>

        <div class="error-msg" id="errorMsg"></div>

        <div class="form-group">
          <label>Email Address</label>
          <input type="email" id="email" placeholder="you@email.com">
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="password" placeholder="Your password" onkeyup="if(event.key==='Enter') loginEmail()">
        </div>
        <div class="forgot-link"><a href="reset.html">Forgot password?</a></div>

        <button class="auth-btn" id="loginBtn" onclick="loginEmail()">Log In</button>

        <div class="divider">or</div>

        <button class="google-btn" id="googleBtn" onclick="loginGoogle()">
          <svg width="20" height="20" viewBox="0 0 24 24">
            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
          </svg>
          <span id="googleBtnText">Continue with Google</span>
        </button>

        <div class="auth-footer">
          Don't have an account? <a href="signup.html">Sign up</a>
        </div>
      </div>

      <div class="redirect-loading" id="redirectLoading">
        <svg class="spin" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#0f4c3a" stroke-width="2.5" stroke-linecap="round"><path d="M21 12a9 9 0 11-9-9"/></svg>
        <p>Completing sign in...</p>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, signInWithPopup, GoogleAuthProvider } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-auth.js";
    import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyD34KXZcVyxnqN_wuP5GShI8uNbe6osXVQ",
      authDomain: "keyscapeltd.org",
      databaseURL: "https://keyscape-homes-default-rtdb.firebaseio.com",
      projectId: "keyscape-homes",
      storageBucket: "keyscape-homes.firebasestorage.app",
      messagingSenderId: "8066332433",
      appId: "1:8066332433:web:571a5335e2796d3845feb0",
      measurementId: "G-F9CP7R9BH5"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    function showError(msg) {
      const el = document.getElementById('errorMsg');
      el.textContent = msg;
      el.style.display = 'block';
    }

    // ===== Google Login via popup =====

    window.loginEmail = async function() {
      document.getElementById('errorMsg').style.display = 'none';
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      if (!email || !password) return showError('Please fill in all fields.');

      const btn = document.getElementById('loginBtn');
      btn.textContent = 'Logging in...';
      btn.disabled = true;

      try {
        const result = await signInWithEmailAndPassword(auth, email, password);
        const snap = await getDoc(doc(db, 'hosts', result.user.uid));
        if (snap.exists() && snap.data().profileComplete) {
          window.location.href = 'index.html';
        } else {
          window.location.href = 'profile.html?setup=true';
        }
      } catch (e) {
        btn.textContent = 'Log In';
        btn.disabled = false;
        if (e.code === 'auth/user-not-found' || e.code === 'auth/wrong-password' || e.code === 'auth/invalid-credential') {
          showError('Incorrect email or password.');
        } else {
          showError('Something went wrong. Please try again.');
        }
      }
    };

    window.loginGoogle = async function() {
      document.getElementById('errorMsg').style.display = 'none';
      const btn = document.getElementById('googleBtn');
      btn.disabled = true;
      document.getElementById('googleBtnText').textContent = 'Opening Google...';

      try {
        const provider = new GoogleAuthProvider();
        const result = await signInWithPopup(auth, provider);
        const ref = doc(db, 'hosts', result.user.uid);
        const snap = await getDoc(ref);
        const isNewHost = !snap.exists();

        if (isNewHost) {
          await setDoc(ref, {
            uid: result.user.uid,
            name: result.user.displayName || '',
            email: result.user.email,
            phone: '',
            photo: result.user.photoURL || '',
            bio: '',
            languages: '',
            hostingSince: '',
            createdAt: new Date().toISOString(),
            profileComplete: false,
            role: 'host'
          });
        }

        // Require a password to be set if this account doesn't have one yet
        const hasPassword = result.user.providerData.some(p => p.providerId === 'password');
        if (!hasPassword) {
          window.location.href = 'set-password.html';
          return;
        }

        if (isNewHost) {
          window.location.href = 'profile.html?setup=true';
        } else if (snap.data().profileComplete) {
          window.location.href = 'index.html';
        } else {
          window.location.href = 'profile.html?setup=true';
        }
      } catch (e) {
        btn.disabled = false;
        document.getElementById('googleBtnText').textContent = 'Continue with Google';
        console.error('Google sign-in error:', e);
        if (e.code === 'auth/popup-closed-by-user') {
          // User closed it themselves
        } else if (e.code === 'auth/unauthorized-domain') {
          showError('This domain is not authorized in Firebase. Code: auth/unauthorized-domain');
        } else if (e.code === 'auth/popup-blocked') {
          showError('Popup was blocked by your browser. Please allow popups for this site.');
        } else {
          showError(`Google sign-in failed. Code: ${e.code || 'unknown'}. ${e.message || ''}`);
        }
      }
    };
  </script>
</body>
</html>
