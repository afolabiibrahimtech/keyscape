<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/jpeg" href="logo/favicon.jpg">
  <title>Set a Password | Keyscape Homes</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root { --primary: #0f4c3a; --accent: #1a8c6b; --light: #f8fafc; --dark: #111827; }
    body { font-family: 'Segoe UI', system-ui, sans-serif; }
    .auth-page {
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: linear-gradient(135deg, #0f4c3a 0%, #1a8c6b 100%); padding: 2rem;
    }
    .auth-card { background: white; border-radius: 20px; padding: 2.5rem; width: 100%; max-width: 440px; box-shadow: 0 25px 60px rgba(0,0,0,0.25); }
    .auth-logo { text-align: center; margin-bottom: 1rem; }
    .auth-logo h1 { color: var(--primary); font-size: 1.6rem; }
    .auth-logo p { color: #666; font-size: 0.95rem; margin-top: 4px; }

    .info-box {
      display: flex; gap: 10px; align-items: flex-start;
      background: #f0fdf4; border: 1px solid #bbf7d0; border-radius: 10px;
      padding: 12px 14px; margin-bottom: 1.4rem; font-size: 0.88rem;
      color: var(--primary); line-height: 1.5;
    }
    .info-box svg { flex-shrink: 0; margin-top: 2px; }

    .form-group { margin-bottom: 1.1rem; }
    .form-group label { display: block; font-weight: 600; margin-bottom: 6px; font-size: 0.9rem; color: var(--dark); }
    .form-group input { width: 100%; padding: 12px 16px; border: 2px solid #e2e8f0; border-radius: 10px; font-size: 1rem; outline: none; transition: border-color 0.2s; }
    .form-group input:focus { border-color: var(--primary); }

    .auth-btn { width: 100%; padding: 14px; background: var(--primary); color: white; border: none; border-radius: 10px; font-size: 1rem; font-weight: 600; cursor: pointer; transition: all 0.2s; margin-top: 0.5rem; }
    .auth-btn:hover { background: var(--accent); transform: translateY(-2px); }
    .auth-btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

    .error-msg { background: #fee2e2; color: #991b1b; padding: 10px 14px; border-radius: 8px; font-size: 0.9rem; margin-bottom: 1rem; display: none; }
    .success-msg { background: #d1fae5; color: #065f46; padding: 10px 14px; border-radius: 8px; font-size: 0.9rem; margin-bottom: 1rem; display: none; }

    .loading-state { text-align: center; padding: 2rem; color: #666; display: flex; flex-direction: column; align-items: center; gap: 1rem; }
    .spin { animation: spin 1s linear infinite; }
    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <div id="loadingState" class="loading-state">
        <svg class="spin" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#0f4c3a" stroke-width="2.5" stroke-linecap="round"><path d="M21 12a9 9 0 11-9-9"/></svg>
        <p>Checking your account...</p>
      </div>

      <div id="formView" style="display:none;">
        <div class="auth-logo">
          <h1>Set a Password</h1>
          <p id="userEmailText"></p>
        </div>

        <div class="info-box">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
          <span>You signed up with Google. Set a password so you can also log in with your email next time.</span>
        </div>

        <div class="error-msg" id="errorMsg"></div>
        <div class="success-msg" id="successMsg">Password set! Redirecting...</div>

        <div class="form-group">
          <label>New Password</label>
          <input type="password" id="password" placeholder="Min. 6 characters">
        </div>
        <div class="form-group">
          <label>Confirm Password</label>
          <input type="password" id="confirmPassword" placeholder="Repeat password" onkeyup="if(event.key==='Enter') savePassword()">
        </div>

        <button class="auth-btn" id="saveBtn" onclick="savePassword()">Set Password & Continue</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js";
    import { getAuth, onAuthStateChanged, EmailAuthProvider, linkWithCredential } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-auth.js";
    import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyD34KXZcVyxnqN_wuP5GShI8uNbe6osXVQ",
      authDomain: "keyscape-homes.firebaseapp.com",
      databaseURL: "https://keyscape-homes-default-rtdb.firebaseio.com",
      projectId: "keyscape-homes",
      storageBucket: "keyscape-homes.firebasestorage.app",
      messagingSenderId: "8066332433",
      appId: "1:8066332433:web:571a5335e2796d3845feb0",
      measurementId: "G-F9CP7R9BH5"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let currentUser = null;

    onAuthStateChanged(auth, (user) => {
      if (!user) {
        window.location.href = 'login.html';
        return;
      }

      // If they already have a password provider, skip this page entirely
      const hasPassword = user.providerData.some(p => p.providerId === 'password');
      if (hasPassword) {
        proceedToNext(user.uid);
        return;
      }

      currentUser = user;
      document.getElementById('userEmailText').textContent = user.email;
      document.getElementById('loadingState').style.display = 'none';
      document.getElementById('formView').style.display = 'block';
    });

    async function proceedToNext(uid) {
      const snap = await getDoc(doc(db, 'hosts', uid));
      if (snap.exists() && snap.data().profileComplete) {
        window.location.href = 'index.html';
      } else {
        window.location.href = 'profile.html?setup=true';
      }
    }

    window.savePassword = async function() {
      const errorEl = document.getElementById('errorMsg');
      const successEl = document.getElementById('successMsg');
      errorEl.style.display = 'none';
      successEl.style.display = 'none';

      const password = document.getElementById('password').value;
      const confirm = document.getElementById('confirmPassword').value;

      if (!password || !confirm) {
        errorEl.textContent = 'Please fill in both fields.';
        errorEl.style.display = 'block';
        return;
      }
      if (password.length < 6) {
        errorEl.textContent = 'Password must be at least 6 characters.';
        errorEl.style.display = 'block';
        return;
      }
      if (password !== confirm) {
        errorEl.textContent = 'Passwords do not match.';
        errorEl.style.display = 'block';
        return;
      }

      const btn = document.getElementById('saveBtn');
      btn.disabled = true;
      btn.textContent = 'Saving...';

      try {
        const credential = EmailAuthProvider.credential(currentUser.email, password);
        await linkWithCredential(currentUser, credential);

        successEl.style.display = 'block';
        setTimeout(() => proceedToNext(currentUser.uid), 1200);
      } catch (e) {
        btn.disabled = false;
        btn.textContent = 'Set Password & Continue';
        if (e.code === 'auth/credential-already-in-use' || e.code === 'auth/email-already-in-use') {
          errorEl.textContent = 'This email already has a password set elsewhere. Try logging in with email and password instead.';
        } else if (e.code === 'auth/weak-password') {
          errorEl.textContent = 'Please choose a stronger password.';
        } else {
          errorEl.textContent = 'Something went wrong. Please try again.';
        }
        errorEl.style.display = 'block';
      }
    };
  </script>
</body>
</html>
